# Сборка и публикация тренажёра на GitHub Pages.
#
# Приложение целиком клиентское: mock-сервер работает в браузере, бэкенда нет,
# поэтому публиковать нужно обычную статику из dist.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить публикацию вручную из вкладки Actions — удобно, когда
  # правок в коде нет, а пересобрать нужно.
  workflow_dispatch:

# Права выдаются задаче, а не токену целиком: id-token нужен deploy-pages для
# доверенной публикации, pages: write — для самой записи сайта.
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно должна идти только одна публикация. Незавершённые отменяются:
# смысла доводить до конца предыдущую сборку нет, её результат всё равно
# перезапишет следующая.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ci, а не install: ставит ровно те версии, что записаны в
      # package-lock.json, и падает при расхождении с package.json.
      - run: npm ci

      # Тесты идут до сборки: сломанный код не должен уезжать на сайт.
      # Публикация при этом не откатывает уже опубликованное — старая версия
      # просто остаётся висеть, а в Actions будет красный крестик.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
